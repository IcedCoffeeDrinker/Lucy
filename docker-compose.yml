services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5001:5001"
    volumes:
      - ./src:/app/src
    depends_on:
      - whisper
      - csm-api
    environment:
      - WHISPER_SERVER_URL=http://whisper:8000/v1/
      - CSM_TTS_SERVER_URL=http://csm-api:8000/v1/
    networks:
      - app-network

  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: faster-whisper-server
    ports:
      - "8000:8000"
    volumes:
      - ./models/whisper-data:/root/.cache/huggingface
    environment:
      - OPENAI_API_KEY=cant-be-empty # Placeholder, isn't needed for Lucy
      - OPENAI_BASE_URL=http://localhost:8000/v1/
      - UV_HTTP_MAX_REQUEST_SIZE=52428800 # 50 MB in bytes, increase if you need to upload larger files.
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  csm-api:
    build:
      context: https://github.com/IcedCoffeeDrinker/sesame_csm_openai-fix_multi_GPU.git#main
      dockerfile: Dockerfile
      args:
        - HF_TOKEN=${HF_TOKEN}
        - TTS_ENGINE=${TTS_ENGINE:-csm}
    ports:
      - "8999:8000"
    volumes:
      - ./models:/app/models
      - ./cloned_voices:/app/cloned_voices
      - ./voice_references:/app/voice_references  
      - ./voice_profiles:/app/voice_profiles    
    environment:
      - HF_TOKEN=${HF_TOKEN}  
      - TTS_ENGINE=${TTS_ENGINE:-csm}  # Default to CSM if not specified
      - CSM_DEVICE_MAP=${CSM_DEVICE_MAP:-balanced}
      - TORCH_COMPILE_MODE=${TORCH_COMPILE_MODE:-none}
      - ENABLE_QUANTIZATION=${ENABLE_QUANTIZATION:-false}
      - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - app-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
networks:
  app-network:
    driver: bridge
